<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Good Morning Kunjiii ❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffecd2, #fcb69f);
      font-family: "Segoe UI", sans-serif;
      overflow: hidden;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      padding: 30px 25px;
      border-radius: 18px;
      text-align: center;
      max-width: 360px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      animation: pop 1s ease;
    }

    h1 {
      color: #ff6f91;
      margin-bottom: 10px;
      animation: glow 2s ease-in-out infinite alternate;
    }

    .type {
      font-size: 18px;
      line-height: 1.6;
      color: #333;
      min-height: 90px;
    }

    .heart {
      position: absolute;
      color: #ff6f91;
      font-size: 20px;
      animation: float 6s linear infinite;
      opacity: 0.7;
    }

    @keyframes float {
      0% { transform: translateY(100vh) scale(1); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
    }

    @keyframes pop {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes glow {
      from { text-shadow: 0 0 5px #ff6f91; }
      to { text-shadow: 0 0 15px #ff6f91; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Good Morning, Kunjiii ☀️</h1>
    <div class="type" id="text"></div>
  </div>

  <script>
    const message = [
      "Kunjiii, you’re my favorite feeling on an ordinary day.",
      "Thinking about you makes me smile for no reason.",
      "Stay happy, I’m always with you in heart. 🌸"
    ];

    let i = 0;
    let j = 0;
    const speed = 50;

    function typeWriter() {
      if (i < message.length) {
        if (j < message[i].length) {
          document.getElementById("text").innerHTML += message[i].charAt(j);
          j++;
          setTimeout(typeWriter, speed);
        } else {
          document.getElementById("text").innerHTML += "<br/>";
          i++;
          j = 0;
          setTimeout(typeWriter, 500);
        }
      }
    }

    typeWriter();

    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = 16 + Math.random() * 24 + "px";
      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 6000);
    }

    setInterval(createHeart, 800);
  </script>
</body>
</html>
